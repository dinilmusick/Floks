name: Refresh email-auth dependency lock (temporary)
on:
  push:
    branches:
      - feat/one-screen-oidc-email-register-20261122
    paths:
      - .github/workflows/refresh-email-auth-lock.yml
      - package.json
      - packages/ui/package.json
permissions:
  contents: write
jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/one-screen-oidc-email-register-20261122
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-resolve updated GutTS package and lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit only refreshed lock metadata
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(auth): pin verified GutTS dependency integrity"
            git push origin HEAD:feat/one-screen-oidc-email-register-20261122
          fi
