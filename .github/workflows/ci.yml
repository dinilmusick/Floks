name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert immutable source SHA and dependency lock
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          sha256sum package.json pnpm-lock.yaml
      - name: Check whitespace errors in the change set
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git merge-base origin/main HEAD)"
          fi
          git diff --check "${base_sha}...HEAD"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build published UI, canvas and contracts as browser and Worker consumers
        run: pnpm test:consumer-browser
      - name: Verify packed Node, Worker and server consumer boundaries
        run: pnpm test:consumer-server
      - name: Verify historical public npm tarball integrity and real exports
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_ARTIFACT_VERSION: 2.0.8
        run: node scripts/verify-public-npm-artifact.mjs
      - name: Pack exact-source release candidate and record checksum
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-evidence
          npm pack --pack-destination artifacts/release-evidence
          sha256sum artifacts/release-evidence/*.tgz > artifacts/release-evidence/candidate-sha256.txt
      - name: Upload independently inspectable npm artifact evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floks-release-candidate-and-registry-evidence
          path: artifacts/release-evidence/
          retention-days: 14
          if-no-files-found: warn
