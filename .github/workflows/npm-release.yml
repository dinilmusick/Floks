name: npm Release

# Only main-branch manual dispatch can audit or explicitly approve publication.
# Dependency upgrades and version bumps must be separately reviewed before this workflow.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a new, unique package version (false = verify only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout exact source commit (never moving main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert exact checkout and record dependency lock
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          sha256sum package.json pnpm-lock.yaml

      - name: Set up Node.js with npm OIDC Trusted Publishing support
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Update npm CLI for OIDC Trusted Publishing
        run: npm install --global npm@latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Build emitted packages
        run: pnpm run build

      - name: Typecheck packages
        run: pnpm run typecheck

      - name: Run full tests and trusted-publisher configuration assertions
        run: pnpm run test

      - name: Verify architecture and real packed browser consumer
        run: |
          pnpm run boundary
          pnpm run test:consumer-browser

      - name: Verify actual packed Node and Worker consumers
        run: pnpm run test:consumer-server

      - name: Read immutable package metadata
        id: package
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.private || !p.name || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(p.version)) {
            throw new Error('Invalid publishable package name or semantic version');
          }
          if (p.publishConfig?.registry !== 'https://registry.npmjs.org/') {
            throw new Error('Refusing noncanonical registry');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'name=' + p.name + '\nversion=' + p.version + '\n');
          NODE

      - name: Check npm version uniqueness and fail closed on registry outages
        id: registry
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org/ > "$RUNNER_TEMP/registry.out" 2> "$RUNNER_TEMP/registry.err"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Immutable npm version already exists; cannot republish it."
          elif grep -Eq 'E404|404 Not Found' "$RUNNER_TEMP/registry.err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Npm registry failure is NOT permission to publish." >&2
            cat "$RUNNER_TEMP/registry.err" >&2
            exit 1
          fi

      - name: Record exact-source provenance in release candidate
        if: >-
          steps.registry.outputs.exists == 'false' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const sourceCommit = process.env.SOURCE_SHA;
          if (!/^[0-9a-f]{40}$/.test(sourceCommit)) throw new Error('Invalid release source SHA');
          fs.writeFileSync('.krusbl-release-attestation.json', JSON.stringify({
            schema: 1, packageName: p.name, version: p.version, sourceCommit,
            releaseWorkflow: process.env.GITHUB_WORKFLOW,
            workflowRunId: process.env.GITHUB_RUN_ID,
          }, null, 2) + '\n');
          NODE

      - name: Produce and inspect actual candidate tarball
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          test -n "$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)"

      - name: Publish new version via npm OIDC (no long-lived npm token)
        if: >-
          steps.registry.outputs.exists == 'false' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish
        run: npm publish --provenance --access public

      - name: Verify public registry artifact independently
        if: >-
          steps.registry.outputs.exists == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for attempt in $(seq 1 30); do
            rm -f "$tmp"/*.tgz
            if npm pack "${PACKAGE_NAME}@${PACKAGE_VERSION}" --pack-destination "$tmp" --prefer-online --registry=https://registry.npmjs.org/ >"$tmp/out" 2>"$tmp/err"; then
              archive="$(find "$tmp" -maxdepth 1 -name '*.tgz' -print -quit)"
              tar -xOzf "$archive" package/package.json >"$tmp/registry-package.json"
              node -e 'const a=require(process.argv[1]); if(a.name!==process.env.PACKAGE_NAME || a.version!==process.env.PACKAGE_VERSION) process.exit(1)' "$tmp/registry-package.json"
              echo "Registry tarball verified for ${PACKAGE_NAME}@${PACKAGE_VERSION}"
              exit 0
            fi
            sleep 10
          done
          cat "$tmp/err" >&2
          exit 1

      - name: Existing version is not evidence of this source release
        if: steps.registry.outputs.exists == 'true'
        run: echo "::warning::Verified historical published package, NOT a release of this source commit."
