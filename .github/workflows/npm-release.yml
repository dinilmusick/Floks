name: npm Release

# Only main-branch manual dispatch can audit or explicitly approve publication.
# Dependency upgrades and version bumps must be separately reviewed before this workflow.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a new, unique package version (false = verify only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout exact source commit (never moving main)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert exact checkout and record dependency lock
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          sha256sum package.json pnpm-lock.yaml

      - name: Set up Node.js with npm OIDC Trusted Publishing support
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Update npm CLI for OIDC Trusted Publishing
        run: npm install --global npm@latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Build emitted packages
        run: pnpm run build

      - name: Typecheck packages
        run: pnpm run typecheck

      - name: Run full tests and trusted-publisher configuration assertions
        run: pnpm run test

      - name: Verify architecture and real packed browser consumer
        run: |
          pnpm run boundary
          pnpm run test:consumer-browser

      - name: Verify actual packed Node and Worker consumers
        run: pnpm run test:consumer-server

      - name: Read immutable package metadata
        id: package
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.private || !p.name || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(p.version)) {
            throw new Error('Invalid publishable package name or semantic version');
          }
          if (p.publishConfig?.registry !== 'https://registry.npmjs.org/') {
            throw new Error('Refusing noncanonical registry');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'name=' + p.name + '\nversion=' + p.version + '\n');
          NODE

      - name: Check npm version uniqueness and fail closed on registry outages
        id: registry
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org/ > "$RUNNER_TEMP/registry.out" 2> "$RUNNER_TEMP/registry.err"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Immutable npm version already exists; cannot republish it."
          elif grep -Eq 'E404|404 Not Found' "$RUNNER_TEMP/registry.err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Npm registry failure is NOT permission to publish." >&2
            cat "$RUNNER_TEMP/registry.err" >&2
            exit 1
          fi

      - name: Record exact-source provenance in release candidate
        if: >-
          steps.registry.outputs.exists == 'false' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const sourceCommit = process.env.SOURCE_SHA;
          if (!/^[0-9a-f]{40}$/.test(sourceCommit)) throw new Error('Invalid release source SHA');
          fs.writeFileSync('.krusbl-release-attestation.json', JSON.stringify({
            schema: 1, packageName: p.name, version: p.version, sourceCommit,
            releaseWorkflow: process.env.GITHUB_WORKFLOW,
            workflowRunId: process.env.GITHUB_RUN_ID,
          }, null, 2) + '\n');
          NODE

      - name: Produce and inspect actual candidate tarball
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ultrst-release"
          npm pack --pack-destination "$RUNNER_TEMP/ultrst-release"
          sha256sum "$RUNNER_TEMP/ultrst-release"/*.tgz
          test -n "$(find "$RUNNER_TEMP/ultrst-release" -maxdepth 1 -name '*.tgz' -print -quit)"

      - name: Publish new version via npm OIDC (no long-lived npm token)
        if: >-
          steps.registry.outputs.exists == 'false' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/ultrst-release" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$archive"
          npm publish "$archive" --provenance --access public

      - name: Verify public registry artifact independently
        if: >-
          steps.registry.outputs.exists == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          PUBLISHED_THIS_RUN: ${{ steps.registry.outputs.exists == 'false' && inputs.publish }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          # npm may accept OIDC publication before the exact version is visible
          # through its registry/read replicas. Avoid npm pack's cached packument:
          # fetch the exact-version registry JSON and its published tarball.
          registry_url="$(node -e "process.stdout.write('https://registry.npmjs.org/' + encodeURIComponent(process.env.PACKAGE_NAME) + '/' + encodeURIComponent(process.env.PACKAGE_VERSION))")"
          verified=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location --max-time 20 \
              --header 'Cache-Control: no-cache' \
              --output "$tmp/registry.json" "$registry_url"; then
              if node --input-type=module - "$tmp/registry.json" <<'NODE' > "$tmp/tarball-url"
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (pkg.name !== process.env.PACKAGE_NAME || pkg.version !== process.env.PACKAGE_VERSION ||
              typeof pkg.dist?.integrity !== 'string' || !pkg.dist.integrity.startsWith('sha512-')) {
            process.exit(1);
          }
          const tarball = new URL(pkg.dist.tarball);
          if (tarball.protocol !== 'https:' || tarball.hostname !== 'registry.npmjs.org') process.exit(1);
          process.stdout.write(tarball.href);
          NODE
              then
                if curl --fail --silent --show-error --location --max-time 30 \
                  --output "$tmp/package.tgz" "$(cat "$tmp/tarball-url")" &&
                  node --input-type=module - "$tmp/registry.json" "$tmp/package.tgz" <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const meta = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const archive = fs.readFileSync(process.argv[3]);
          const digest = 'sha512-' + createHash('sha512').update(archive).digest('base64');
          if (digest !== meta.dist.integrity) throw new Error('Registry tarball integrity does not match exact-version metadata.');
          NODE
                then
                  tar -xOzf "$tmp/package.tgz" package/package.json > "$tmp/package.json"
                  node --input-type=module - "$tmp/package.json" <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (pkg.name !== process.env.PACKAGE_NAME || pkg.version !== process.env.PACKAGE_VERSION) {
            throw new Error('Published tarball package name/version mismatch.');
          }
          NODE
                  if tar -xOzf "$tmp/package.tgz" package/.krusbl-release-attestation.json > "$tmp/attestation.json" 2>/dev/null; then
                    node --input-type=module - "$tmp/attestation.json" <<'NODE'
          import fs from 'node:fs';
          const attestation = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (attestation.packageName !== process.env.PACKAGE_NAME ||
              attestation.version !== process.env.PACKAGE_VERSION ||
              !/^[0-9a-f]{40}$/.test(attestation.sourceCommit)) {
            throw new Error('Invalid source attestation in published archive.');
          }
          if (process.env.PUBLISHED_THIS_RUN === 'true' && attestation.sourceCommit !== process.env.SOURCE_SHA) {
            throw new Error('New publication source SHA does not match exact workflow checkout.');
          }
          console.log('Registry artifact source SHA: ' + attestation.sourceCommit);
          NODE
                  elif [[ "$PUBLISHED_THIS_RUN" == "true" ]]; then
                    echo "::error::Fresh publication is missing its source attestation." >&2
                    exit 1
                  fi
                  echo "Verified public registry tarball and SHA-512 integrity for ${PACKAGE_NAME}@${PACKAGE_VERSION}"
                  verified=true
                  break
                fi
              fi
            fi
            echo "::notice::npm registry has not yet exposed ${PACKAGE_NAME}@${PACKAGE_VERSION} (check ${attempt}/60)."
            sleep 15
          done
          if [[ "$verified" != "true" ]]; then
            echo "::error::npm publication may have been accepted, but exact-version metadata and tarball are not independently retrievable. Do not republish or bump the immutable version; retry this workflow with publish=false." >&2
            exit 1
          fi

      - name: Existing version is not evidence of this source release
        if: steps.registry.outputs.exists == 'true'
        run: echo "::warning::Verified historical published package, NOT a release of this source commit."
