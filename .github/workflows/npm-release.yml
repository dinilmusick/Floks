name: npm Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/npm-release.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "**/package.json"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish to npm (leave false to validate only)"
        required: true
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha)
    name: Test, sync dependencies, and publish
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Update npm CLI for OIDC Trusted Publishing
        run: npm install --global npm@latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Sync published upstream dependencies
        id: updates
        if: github.event_name == 'schedule' || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if npm view @dinilmusick/gutts version >/dev/null 2>&1; then
            GUT_VERSION="$(npm view @dinilmusick/gutts version)"
            export GUT_VERSION
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const file = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            const name = '@dinilmusick/gutts';
            pkg.dependencies ??= {};
            if (!pkg.dependencies[name] && !pkg.devDependencies?.[name] && !pkg.optionalDependencies?.[name] && !pkg.peerDependencies?.[name]) {
              pkg.peerDependencies ??= {};
              pkg.peerDependenciesMeta ??= {};
              pkg.peerDependencies[name] = '^' + process.env.GUT_VERSION;
              pkg.peerDependenciesMeta[name] = { optional: true };
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
              console.log('Added optional public GutTS peer at ' + pkg.peerDependencies[name]);
            }
          NODE
          fi
          npx --yes npm-check-updates@latest --upgrade --workspaces --filter '@dinilmusick/gutts,@ultrst-armada/krnl,@ultrst-armada/frnlts,@ultrst-armada/kloks,@ultrst-armada/floks'
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # Push-triggered runs also refresh the lockfile for explicitly pinned published versions.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet -- package.json ':(glob)**/package.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh lockfile after upstream dependency changes
        if: (github.event_name == 'schedule' || github.event_name == 'push') && steps.updates.outputs.changed == 'true'
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Install dependencies
        if: (github.event_name != 'schedule' && github.event_name != 'push') || steps.updates.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: github.event_name != 'push' && (github.event_name != 'schedule' || steps.updates.outputs.changed == 'true')
        run: pnpm run build

      - name: Typecheck
        if: github.event_name != 'push' && (github.event_name != 'schedule' || steps.updates.outputs.changed == 'true')
        run: pnpm run typecheck

      - name: Test
        if: github.event_name != 'push' && (github.event_name != 'schedule' || steps.updates.outputs.changed == 'true')
        run: pnpm run test

      - name: Inspect package contents
        if: github.event_name != 'push' && (github.event_name != 'schedule' || steps.updates.outputs.changed == 'true')
        run: npm pack --dry-run

      - name: Commit validated upstream dependency updates
        if: (github.event_name == 'schedule' || github.event_name == 'push') && steps.updates.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add package.json ':(glob)**/package.json' pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No validated dependency or lockfile changes to commit."
            exit 0
          fi
          mkdir -p .changeset
          cat > .changeset/upstream-dependency-sync.md <<'CHANGESET'
          ---
          "@ultrst-armada/floks": patch
          ---

          Sync validated upstream ecosystem dependencies and lockfile.
          CHANGESET
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset
          git commit -m "chore(deps): sync validated upstream packages"
          git push origin HEAD:main

      - name: Apply Krusbl changeset version and consume release intent
        id: changeset
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A concurrent dependency-sync push can advance main while this release job
          # is running. Re-read main and re-apply the version bump instead of failing
          # with a non-fast-forward push or dropping a pending changeset.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            node --input-type=module <<'NODE' > "$RUNNER_TEMP/krusbl-bump"
            import fs from 'node:fs';
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const order = { patch: 1, minor: 2, major: 3 };
            let selected = '';
            if (fs.existsSync('.changeset')) {
              for (const file of fs.readdirSync('.changeset').filter(f => f.endsWith('.md') && f !== 'README.md')) {
                const text = fs.readFileSync('.changeset/' + file, 'utf8');
                const front = text.split('---').slice(1, 2)[0] || '';
                const line = front.split('\n').find(value => value.includes(pkg.name));
                const match = line?.match(/:\s*(major|minor|patch)\s*$/);
                if (match && (!selected || order[match[1]] > order[selected])) selected = match[1];
              }
            }
            process.stdout.write(selected);
          NODE

            BUMP="$(cat "$RUNNER_TEMP/krusbl-bump")"
            if [ -z "$BUMP" ]; then
              echo "No pending Krusbl changeset found on latest main."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            npm version "$BUMP" --no-git-tag-version
            find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -delete
            git add -A package.json pnpm-lock.yaml .changeset
            git commit -m "chore(release): apply Krusbl changeset [skip ci]"

            if git push origin HEAD:main; then
              echo "Applied $BUMP changeset and pushed release version."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "main advanced during release attempt $attempt; retrying against latest main."
          done

          echo "Could not apply changeset after three fast-forward retries." >&2
          exit 1

      - name: Validate package metadata
        id: package
        if: (github.event_name != 'schedule' && github.event_name != 'push') || steps.updates.outputs.changed == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.private) throw new Error('Refusing to publish: package.json has private=true');
          if (!p.name || !p.version) throw new Error('package.json must define name and version');
          if (!p.publishConfig || p.publishConfig.registry !== 'https://registry.npmjs.org/') {
            throw new Error('Expected publishConfig.registry to be https://registry.npmjs.org/');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'name=' + p.name + '\nversion=' + p.version + '\n');
          console.log('Validated ' + p.name + '@' + p.version);
          NODE

      - name: Check whether this version is already published
        id: registry
        if: (github.event_name != 'schedule' && github.event_name != 'push') || steps.updates.outputs.changed == 'true'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already on npm; publish will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify published registry artifact metadata
        if: steps.registry.outputs.exists == 'true'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" dist --json

      - name: Write Krusbl release attestation
        if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && steps.registry.outputs.exists == 'false') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const sourceCommit = process.env.SOURCE_COMMIT;
          if (!/^[0-9a-f]{40}$/i.test(sourceCommit)) throw new Error('Missing immutable source commit for release attestation');
          fs.writeFileSync('.krusbl-release-attestation.json', JSON.stringify({
            schema: 1,
            packageName: pkg.name,
            version: pkg.version,
            sourceCommit,
            releaseWorkflow: process.env.GITHUB_WORKFLOW,
            workflowRunId: process.env.GITHUB_RUN_ID,
          }, null, 2) + '\n');
          NODE

      - name: Publish to npm using Trusted Publishing
        if: (github.event_name == 'workflow_run' || github.event_name == 'release' || (github.event_name == 'schedule' && steps.updates.outputs.changed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish)) && steps.registry.outputs.exists == 'false'
        run: npm publish --provenance --access public
      - name: Notify downstream consumers after successful upstream publication
        if: success() && steps.registry.outputs.exists == 'false' && (github.event_name == 'workflow_run' || github.event_name == 'release' || (github.event_name == 'schedule' && steps.updates.outputs.changed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          SYNC_TOKEN: ${{ secrets.ECOSYSTEM_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "ECOSYSTEM_SYNC_TOKEN is not configured; scheduled dependency-sync fallbacks remain active."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const consumers = ['Kult-Engine', 'Theta-Engine', 'Kelt-Engine', 'Skipo'];
          for (const consumer of consumers) {
            const response = await fetch(`https://api.github.com/repos/dinilmusick/${consumer}/dispatches`, {
              method: 'POST',
              headers: {
                Authorization: 'Bearer ' + process.env.SYNC_TOKEN,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                event_type: 'upstream-package-published',
                client_payload: {
                  package: pkg.name,
                  version: pkg.version,
                  repository: process.env.GITHUB_REPOSITORY,
                  commit: process.env.GITHUB_SHA,
                },
              }),
            });
            if (!response.ok) {
              console.warn('Consumer dispatch warning for ' + consumer + ' [' + response.status + ']: ' + await response.text());
            } else {
              console.log('Notified ' + consumer + ' about ' + pkg.name + '@' + pkg.version);
            }
          }
          NODE
